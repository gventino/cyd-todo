[package]
name = "cyd-todo-server"
version = "0.1.0"
edition = "2024"

[dependencies]
getrandom = "0.4.3"
poem = { version = "3", features = ["test"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_urlencoded = "0.7.1"
sha2 = "0.11.2"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "derive", "macros"] }
subtle = "2.6.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "signal"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
